# Manual preparation only. Running this private-repository workflow may consume the owner's Actions quota.
# No application/bridge execution, signing, installation, Store submission or release publication.
name: Prepare unsigned Store MSIX (manual)

'on':
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Exact Package/Identity/Name from Partner Center Product identity'
        required: true
        type: string
      publisher:
        description: 'Exact Package/Identity/Publisher, including the complete CN=... value'
        required: true
        type: string
      publisher_display_name:
        description: 'Exact Package/Properties/PublisherDisplayName from Partner Center'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-submission:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
      STORE_PUBLISHER: ${{ inputs.publisher }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
      DOMTRACK_TEST_REAL_DPAPI: '0'
      DOMTRACK_DISABLE_DESKTOP: '1'
    steps:
      - name: Check out reviewed private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate exact identity before restoring or compiling anything
        run: ./ci/Build-StorePackage.ps1 -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -ValidateIdentityOnly
      - name: Test packaging structure without invoking app or SDK binaries
        run: ./packaging/msix/Test-StorePackaging.ps1
      - name: Restore pinned official Node and WebView2 SDK
        run: ./ci/Restore-Dependencies.ps1 -AppRoot ./app -DownloadDirectory ./.build/downloads
      - name: Test source with mocked Windows integrations
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          & ./app/runtime/node.exe --test --test-isolation=none --test-reporter=junit --test-reporter-destination=reports/store-source-tests.xml 'app/tests/*.test.cjs'
          if ($LASTEXITCODE -ne 0) { throw 'Source checks failed.' }
      - name: Compile reviewed desktop source without executing it
        run: ./ci/Build-Source.ps1 -AppRoot ./app -OutputDirectory ./dist/unsigned
      - name: Restore official pinned Windows SDK packaging tools
        id: packaging_sdk
        run: |
          $taskSdk = ./ci/Restore-PackagingTools.ps1 -OutputDirectory ./.build/windows-sdk -DownloadDirectory ./.build/downloads
          if ([string]::IsNullOrWhiteSpace($taskSdk.MakeAppxPath)) { throw 'Packaging SDK restore did not return MakeAppxPath.' }
          "makeappx_path=$($taskSdk.MakeAppxPath)" >> $env:GITHUB_OUTPUT
      - name: Create unsigned MSIX with verified official Windows SDK MakeAppx
        env:
          MAKEAPPX_PATH: ${{ steps.packaging_sdk.outputs.makeappx_path }}
        run: ./ci/Build-StorePackage.ps1 -SourceBuildDirectory ./dist/unsigned -OutputDirectory ./dist/store -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -MakeAppxPath $env:MAKEAPPX_PATH
      - name: Retain private submission files for human review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: domtrack-unsigned-store-submission-${{ github.sha }}
          path: |
            dist/store/*.msix
            dist/store/*.sha256
            dist/store/store-package-evidence.json
            dist/store/SUBMISSION-ONLY.txt
          if-no-files-found: error
          retention-days: 7
