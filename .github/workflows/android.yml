name: Android standalone development
on:
  push:
    branches: [android-standalone]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Select JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Verified Gradle 8.13
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Unit tests, APK and Android lint
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon --console=plain --stacktrace -p android testDebugUnitTest assembleDebug lintDebug 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'android-build.log').read_text(errors='replace')
          lines = log.splitlines()
          start = next((i for i, line in enumerate(lines) if '* What went wrong:' in line), max(0, len(lines) - 100))
          excerpt = '\n'.join(lines[start:start + 130])[:16000]
          escaped = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android Gradle failure::' + escaped)
          import xml.etree.ElementTree as ET
          for report in Path('android/app/build/test-results').glob('**/TEST-*.xml'):
              for case in ET.parse(report).getroot().iter('testcase'):
                  problem = case.find('failure')
                  if problem is None:
                      problem = case.find('error')
                  if problem is not None:
                      details = (case.get('name', '') + '\n' + (problem.text or problem.get('message', '')))[:5000]
                      details = details.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Android unit test::' + details)
          PY
          fi
          exit "$build_status"
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/APK-MANIFEST.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS
      - name: Android 16 native startup and navigation
        run: bash android/ci/emulator-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: DomTrack-Android-development
          path: |
            android/app/build/outputs/apk/debug/
            android/app/build/reports/
            android/app/build/test-results/
            ${{ runner.temp }}/android-build.log
          if-no-files-found: warn
          retention-days: 14
