<!doctype html><html lang="ru"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://tile.openstreetmap.org data:; connect-src 'none'"><style>html,body,#map{height:100%;margin:0}/*LEAFLET_CSS*/</style></head><body><div id="map"></div><script>/*LEAFLET_JS*/</script><script>
const points=/*POINT_DATA*/;window.zone=/*ZONE_DATA*/;window.drawing=false;
const map=L.map('map').setView([47.8388,35.1396],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const coords=[];for(const p of points){const el=document.createElement('div');el.textContent=p.title+' · '+p.price;L.circleMarker([p.lat,p.lon],{radius:7,color:'#137d66'}).addTo(map).bindPopup(el);coords.push([p.lat,p.lon]);}if(coords.length)map.fitBounds(coords,{maxZoom:14,padding:[20,20]});let polygon;
window.redraw=()=>{if(polygon)map.removeLayer(polygon);if(window.zone.length)polygon=L.polygon(window.zone,{color:'#137d66'}).addTo(map);};map.on('click',e=>{if(window.drawing){window.zone.push([e.latlng.lat,e.latlng.lng]);window.redraw();}});window.redraw();
</script></body></html>
